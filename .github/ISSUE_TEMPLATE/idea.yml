name: Idea / feedback
description: Suggest a feature, a new engine, or share feedback
title: "[IDEA]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas and feedback are very welcome. ArpeggiGator is in early stage.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A new engine, a control change, a workflow improvement — anything.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Related mode (optional)
      placeholder: "ARP / MELODY / MUTATOR / ACCORDATOR / ORBITATOR"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the existing issues and discussions
          required: false
